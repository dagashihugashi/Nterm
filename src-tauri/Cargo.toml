[package]
name = "orca"
version = "0.2.0"
description = "Portable SSH terminal client (Tera Term alternative)"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "orca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# AI あり版（Orca、正規版）。AI なし版（Orca-NoAI）のビルドには AI のコードを含めない（AI.md 9 章）
ai = ["dep:ureq"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# openssl-on-win32: Windows でも libssh2 の暗号バックエンドを OpenSSL にする
# （既定の WinCNG は curve25519 / ecdh / ed25519 に未対応で、OpenSSH 10 系に接続できない）
# バージョンは「メジャー.マイナー」までの指定にする（社内のクレートのミラーにある版で解決できるように。README「社内でビルドする場合」）
ssh2 = { version = "0.9", features = ["vendored-openssl", "openssl-on-win32"] }
vte = "0.15"
unicode-width = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
encoding_rs = "0.8"
windows = { version = "0.62", features = [
    "Win32_Security_Cryptography",
    "Win32_Foundation",
    # タイトルバーの色（テーマ）。Windows 11 のみ有効
    "Win32_Graphics_Dwm",
] }
tauri-plugin-dialog = "2"
clipboard-win = "5"
# AI の API 呼び出し（AI あり版のみ）。プロキシは環境変数（HTTPS_PROXY 等）から読む（Claude Code と同じ）。
# 社内のミラーで解決しやすいよう、追加の機能（Windows の証明書ストア・プロキシ設定）は使わない
ureq = { version = "3", optional = true, default-features = false, features = ["rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
